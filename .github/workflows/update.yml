name: Daten aktualisieren
on:
  workflow_dispatch:          # Button in der App
  push:
    branches: [main]          # nach Änderungen an den Dateien
  schedule:                   # Sonntag 10:00 und 16:00 UTC (11:00 und 17:00 Uhr Winterzeit)
    - cron: "0 10 * * 0"
    - cron: "0 16 * * 0"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build.py
      - run: mkdir _site && cp index.html manifest.json sw.js icon-*.png data.json _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
