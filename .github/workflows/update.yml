name: Daten aktualisieren
on:
  workflow_dispatch:          # Button in der App
  push:
    branches: [main]          # nach Änderungen an den Dateien
  schedule:                   # Sonntag, Zeiten in UTC. Winterzeit: 11:00, 17:00, 18:43, 21:48 Uhr
    - cron: "0 10 * * 0"
    - cron: "0 16 * * 0"
    - cron: "43 17 * * 0"     # 18:43 Uhr Winterzeit
    - cron: "48 20 * * 0"     # 21:48 Uhr Winterzeit
    - cron: "43 16 * * 0"     # 18:43 Uhr Sommerzeit (September/Oktober)
    - cron: "48 19 * * 0"     # 21:48 Uhr Sommerzeit
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip                # Pakete zwischenspeichern, spart ca. 1 Minute
      - run: pip install -r requirements.txt
      - run: python build.py
      - run: mkdir _site && cp index.html manifest.json sw.js icon-*.png data.json _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
